[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kvcalc"
version = "0.1.0"
description = "KV cache VRAM calculator and live monitor for LLM serving: predict memory per model and config, then track real block utilisation on vLLM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noman Jafar", email = "numanjafarshahzad@gmail.com" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
kvcalc = "kvcalc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kvcalc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
